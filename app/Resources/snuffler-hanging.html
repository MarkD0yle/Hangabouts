<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hangabout: Snuffler</title>
<style>
/* The page is exactly 270x262 px, transparent. The swing's ropes start at the top centre (135, 0). 1 world unit = 79 px. */
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:270px;height:262px}
#stage{position:absolute;inset:0}
#stage.hidden{visibility:hidden}
#hit{all:unset;display:block;width:270px;height:262px;cursor:pointer;touch-action:none}
#hit:focus-visible{outline:2px solid #2F5BD3;outline-offset:-2px;border-radius:12px}
#gl{display:block;width:270px;height:262px;pointer-events:none;filter:drop-shadow(1px 4px 4px rgba(20,12,4,.33))}
@keyframes hb-drop{0%{transform:translateY(-110%)}62%{transform:translateY(5%)}80%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
@keyframes hb-climb{0%{transform:translateY(0)}18%{transform:translateY(4%)}100%{transform:translateY(-110%)}}
#stage.dropping{animation:hb-drop .75s cubic-bezier(.3,1.1,.5,1) both}
#stage.climbing{animation:hb-climb .65s cubic-bezier(.5,0,.8,.4) both}
#stage.reduced{animation:none !important}
</style>
</head>
<body>
<div id="stage" class="hidden">
<button id="hit" type="button" aria-label="Snuffler needs you. Show details"><canvas id="gl"></canvas></button>
</div>

<!-- Snuffler is a 3D model described as distance fields, drawn by this shader. No libraries. -->
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uYaw, uSwing, uSignSwing, uSignYaw, uBlink, uKick, uTail, uSniff, uFail, uBreathe;

float smin(float a, float b, float k){ float h = clamp(.5 + .5*(b-a)/k, 0., 1.); return mix(b, a, h) - k*h*(1.-h); }
float sdEll(vec3 p, vec3 r){ float k0 = length(p/r); float k1 = length(p/(r*r)); return k0*(k0-1.)/k1; }
float sdCap(vec3 p, vec3 a, vec3 b, float r1, float r2){
  vec3 pa = p-a, ba = b-a; float h = clamp(dot(pa,ba)/dot(ba,ba), 0., 1.);
  return length(pa - ba*h) - mix(r1, r2, h);
}
float sdBox(vec3 p, vec3 b, float r){ vec3 q = abs(p)-b; return length(max(q,0.)) + min(max(q.x,max(q.y,q.z)),0.) - r; }
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c,-s,s,c); }

// The swing: two ropes from the top centre of the page down to a bar. Everything swings about the top.
// The ropes meet at one point, so the swing twists with him when he turns.
const float BAR = .46;                       // how far the bar hangs below the top
// world -> Snuffler's own space. The bar is at y = 0; his hand grips it straight above his shoulder.
vec3 toLocal(vec3 p){ p.xy = rot(uSwing)*p.xy; p.y += BAR; p.xz = rot(-uYaw)*p.xz; return p; }

const vec3 HEAD = vec3(0., -.93, .06);
const vec3 EYE_L = vec3(-.21, -.805, .36);   // big eye, with the monocle (his left, the near side when he faces right)
const vec3 EYE_R = vec3( .20, -.825, .37);
vec3 noseTip(){ return vec3(uSniff*.05, -1.49 + abs(uSniff)*.02, .79); }
// the sign hangs from the nose and always turns to face the viewer
vec3 toSign(vec3 p){
  vec3 q = p - (noseTip() + vec3(0., -.09, 0.));
  q.xz = rot(uYaw + uSignYaw)*q.xz;
  q.xy = rot(uSignSwing)*q.xy;
  return q;
}

// returns (distance, material). 1 fur, 3 nose, 4 eye, 5 gold, 6 bag, 7 strap, 8 card, 9 dark, 10 rope, 11 wood
vec2 U(vec2 a, vec2 b){ return a.x < b.x ? a : b; }
vec2 map(vec3 pw){
  vec3 p = toLocal(pw);
  float br = 1. + uBreathe;
  float d = sdEll(p - vec3(0., -1.50, -.02), vec3(.50*br, .54, .47*br));
  d = smin(d, length(p - HEAD) - .40, .15);
  // hanging arm (his right): straight up from the shoulder to a fist round the bar, bowed out a little past the ear
  d = smin(d, sdCap(p, vec3(.48,-1.20,0.), vec3(.60,-.66,0.), .105, .095), .09);
  d = smin(d, sdCap(p, vec3(.60,-.66,0.), vec3(.56,-.06,0.), .095, .09), .08);
  d = smin(d, sdEll(p - vec3(.56,-.005,0.), vec3(.13,.125,.13)), .05);
  // resting arm (his left) and hand
  d = smin(d, sdCap(p, vec3(-.46,-1.16,.04), vec3(-.55,-1.50,.13), .10, .09), .09);
  d = smin(d, length(p - vec3(-.55,-1.54,.14)) - .105, .05);
  // ears (they droop when he's failed)
  vec3 pe = p; pe.x = abs(pe.x);
  d = smin(d, sdEll(pe - vec3(.33 + .04*uFail, -.63 - .09*uFail, -.02), vec3(.15,.15,.10)), .06);
  // hair tuft
  d = smin(d, sdCap(p, vec3(-.03,-.55,.06), vec3(-.07,-.42,.13), .036, .024), .04);
  d = smin(d, sdCap(p, vec3(.04,-.55,.04), vec3(.07,-.43,.10), .036, .024), .04);
  // legs and feet
  vec3 pl = p - vec3(0., -1.93, 0.); pl.yz = rot(uKick)*pl.yz; pl.x = abs(pl.x);
  d = smin(d, sdCap(pl, vec3(.20,0.,0.), vec3(.22,-.17,.02), .115, .105), .10);
  d = smin(d, sdEll(pl - vec3(.23,-.25,.10), vec3(.135,.095,.19)), .07);
  // snout: three tapering segments, forward then down
  vec3 s0 = vec3(0.,-1.03,.30), s1 = vec3(0.,-1.04,.60), s2 = vec3(uSniff*.02,-1.25,.79), s3 = noseTip();
  d = smin(d, sdCap(p, s0, s1, .205, .175), .12);
  d = smin(d, sdCap(p, s1, s2, .175, .145), .09);
  d = smin(d, sdCap(p, s2, s3, .145, .118), .08);
  // tail: curls up behind him
  vec3 pt = p - vec3(0., -1.80, -.33); pt.yz = rot(uTail)*pt.yz;
  float tl = sdCap(pt, vec3(0.), vec3(0.,.00,-.34), .095, .088);
  tl = smin(tl, sdCap(pt, vec3(0.,.00,-.34), vec3(0.,.26,-.48), .088, .08), .06);
  tl = smin(tl, sdCap(pt, vec3(0.,.26,-.48), vec3(0.,.43,-.32), .08, .074), .06);
  tl = smin(tl, sdCap(pt, vec3(0.,.43,-.32), vec3(0.,.36,-.19), .074, .07), .06);
  d = smin(d, tl, .08);
  vec2 res = vec2(d, 1.);

  res = U(res, vec2(length(p - (s3 + vec3(0.,-.04,.01))) - .125, 3.));
  res = U(res, vec2(length(p - EYE_L) - .135, 4.));
  res = U(res, vec2(length(p - EYE_R) - .092, 4.));
  // monocle: a gold ring standing just off the big eye
  vec3 f = normalize(EYE_L - HEAD);
  vec3 qm = p - (EYE_L + f*.075); float h = dot(qm, f);
  res = U(res, vec2(length(vec2(length(qm - f*h) - .16, h)) - .024, 5.));
  // brows
  float tilt = .07*uFail;
  res = U(res, vec2(sdCap(p, vec3(-.35,-.625+tilt,.27), vec3(-.11,-.605-tilt,.43), .024, .024), 9.));
  res = U(res, vec2(sdCap(p, vec3(.13,-.70-tilt,.42), vec3(.29,-.71+tilt,.32), .02, .02), 9.));
  // satchel on his left hip, strap over the right shoulder
  vec3 qs = p - vec3(0., -1.40, -.02); qs.xy = rot(-.78)*qs.xy; qs.z *= 1.08;
  res = U(res, vec2((length(vec2(length(qs.xz) - .50, qs.y*.6)) - .022)*.85, 7.));
  res = U(res, vec2(sdBox(p - vec3(-.58,-1.68,.0), vec3(.045,.085,.135), .085), 6.));
  res = U(res, vec2(sdBox(p - vec3(-.60,-1.50,-.03), vec3(.008,.07,.09), .006), 8.));
  // string and sign
  vec3 q = toSign(p);
  res = U(res, vec2(sdCap(q, vec3(0.), vec3(0.,-.2,0.), .012, .012), 9.));
  res = U(res, vec2(sdBox(q - vec3(0.,-.47,0.), vec3(.22,.195,.018), .07), 8.));
  // the swing: ropes from the top centre to each end of the bar
  vec3 ps = p; ps.x = abs(ps.x);
  res = U(res, vec2(sdCap(ps, vec3(.03,BAR+.02,0.), vec3(.64,0.,0.), .02, .02), 10.));
  res = U(res, vec2(sdCap(ps, vec3(0.,0.,0.), vec3(.72,0.,0.), .042, .042), 11.));
  res = U(res, vec2(length(ps - vec3(.72,0.,0.)) - .06, 11.));
  return res;
}

vec3 calcN(vec3 p){
  vec2 e = vec2(.0015, -.0015);
  return normalize(e.xyy*map(p+e.xyy).x + e.yyx*map(p+e.yyx).x + e.yxy*map(p+e.yxy).x + e.xxx*map(p+e.xxx).x);
}
float shadow(vec3 ro, vec3 rd){
  float res = 1., t = .03;
  for (int i = 0; i < 22; i++){
    float h = map(ro + rd*t).x;
    res = min(res, 9.*h/t);
    t += clamp(h, .02, .16);
    if (res < .02 || t > 1.8) break;
  }
  return clamp(res, 0., 1.);
}
float ao(vec3 p, vec3 n){
  float o = 0., s = 1.;
  for (int i = 1; i <= 4; i++){ float h = .045*float(i); o += (h - map(p + n*h).x)*s; s *= .62; }
  return clamp(1. - 2.4*o, 0., 1.);
}

// "?" and "!" as 2D shapes on the card
float glyph(vec2 u){
  float dotd = length(u - vec2(0.,-.145)) - .036;
  vec2 c = u - vec2(0., .065);
  float hook = max(abs(length(c) - .078) - .028, -max(c.x, c.y + .01));
  float stem = length(vec2(u.x, u.y - clamp(u.y, -.07, -.013))) - .028;
  float qm = min(min(hook, stem), dotd);
  float bang = min(length(vec2(u.x, u.y - clamp(u.y, -.05, .13))) - mix(.022, .04, clamp((u.y+.05)/.18, 0., 1.)), dotd);
  return mix(qm, bang, step(.5, uFail));
}

void shade(vec3 pw, vec3 n, float m, out vec3 alb, out float gloss, out float specAmt){
  vec3 p = toLocal(pw);
  gloss = 12.; specAmt = .10;
  if (m < 1.5){
    alb = vec3(.90, .62, .17);
    // belly patch
    float b = sdEll(p - vec3(0., -1.58, .42), vec3(.31, .39, .20));
    alb = mix(alb, vec3(1., .88, .58), smoothstep(.03, -.04, b));
    // snout darkens toward the tip
    float sn = smoothstep(.36, .9, p.z) * step(-1.72, p.y) * step(p.y, -.82);
    alb = mix(alb, vec3(.62, .38, .10), sn*.85);
    // ringed tail
    if (p.z < -.36 && p.y > -1.95 && p.y < -1.2){
      float a = atan(p.y + 1.60, p.z + .66);
      alb = mix(vec3(.80,.52,.14), vec3(.42,.25,.07), smoothstep(-.15, .15, sin(a*6.5)));
    }
    // pink inside the ears, blush on the cheeks
    vec2 ec = vec2(abs(p.x) - (.33 + .04*uFail), p.y + .63 + .09*uFail);
    alb = mix(alb, vec3(.96,.55,.48), smoothstep(.105, .065, length(ec)) * step(.0, p.z) * step(abs(p.x), .47));
    alb = mix(alb, vec3(.97,.55,.45), .45*smoothstep(.14, .03, length(vec3(abs(p.x)-.31, p.y+1.03, p.z-.26))));
  } else if (m < 3.5){
    alb = vec3(.07,.04,.03); gloss = 60.; specAmt = .9;
  } else if (m < 4.5){
    bool big = p.x < 0.;
    vec3 c = big ? EYE_L : EYE_R; float r = big ? .135 : .092;
    vec3 fwd = normalize(vec3(big ? -.38 : .34, .02, 1.));
    float a = dot(normalize(p - c), fwd);
    alb = vec3(.97,.96,.93);
    alb = mix(alb, mix(vec3(.82,.48,.14), vec3(.38,.19,.05), smoothstep(.86,.80,a)), smoothstep(.79,.81,a));
    alb = mix(alb, vec3(.02), smoothstep(.925,.94,a));
    gloss = 90.; specAmt = 1.;
    // eyelid: closes on a blink, half closed when failed
    float lid = mix(1.3, -1.2, uBlink);
    if (big) lid = min(lid, mix(1.3, .22, uFail));
    if ((p.y - c.y)/r > lid){ alb = vec3(.84,.57,.16); gloss = 12.; specAmt = .1; }
  } else if (m < 5.5){
    alb = vec3(.93,.70,.22); gloss = 50.; specAmt = 1.2;
  } else if (m < 6.5){
    alb = mix(vec3(.33,.46,.28), vec3(.45,.60,.38), smoothstep(-1.67, -1.61, p.y));
    alb = mix(alb, vec3(.93,.76,.28), smoothstep(.03,.02, length(vec2(p.y+1.67, p.z-.0))) * step(p.x, -.66));
    specAmt = .18; gloss = 20.;
  } else if (m < 7.5){
    alb = vec3(.26,.37,.22); specAmt = .12;
  } else if (m < 8.5){
    alb = vec3(.99,.99,.97); specAmt = .25; gloss = 30.;
    vec3 q = toSign(p);
    if (q.y < -.2 && q.z > 0.){
      vec2 u = q.xy - vec2(0., -.47);
      vec3 ink = mix(vec3(.16,.33,.85), vec3(.75,.12,.09), step(.5, uFail));
      alb = mix(alb, ink, smoothstep(.006, -.006, glyph(u)));
      alb = mix(alb, vec3(.86,.88,.84), smoothstep(.006, .0, abs(sdBox(vec3(u,0.), vec3(.19,.165,1.), .055)) - .004));
    }
  } else if (m < 9.5){
    alb = vec3(.30,.18,.07); specAmt = .15;
  } else if (m < 10.5){
    // rope: twisted strands
    alb = mix(vec3(.80,.66,.42), vec3(.60,.46,.26), smoothstep(-.3, .3, sin((p.y + abs(p.x)*.9)*95.)));
    specAmt = .05;
  } else {
    // wooden bar, with a little grain
    alb = mix(vec3(.58,.36,.17), vec3(.46,.27,.11), smoothstep(-.4, .4, sin(p.x*60. + sin(p.z*40.)*1.5)));
    specAmt = .3; gloss = 30.;
  }
}

void main(){
  // 3.4 x 3.3 units of world. The swing's ropes start at the top centre of the page, which is the pivot.
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 ro = vec3((uv.x - .5)*3.4, -(1. - uv.y)*3.3, 3.);
  vec3 rd = vec3(0., 0., -1.);

  float t = 0., minD = 1e3, m = 0.; bool hit = false;
  for (int i = 0; i < 80; i++){
    vec2 h = map(ro + rd*t);
    minD = min(minD, h.x);
    if (h.x < .0012){ hit = true; m = h.y; break; }
    t += h.x * .92;
    if (t > 6.) break;
  }
  if (!hit){
    gl_FragColor = vec4(0.); return;
  }
  vec3 p = ro + rd*t;
  vec3 n = calcN(p);
  vec3 alb; float gloss, specAmt;
  shade(p, n, m, alb, gloss, specAmt);
  alb = pow(alb, vec3(2.2));

  vec3 L = normalize(vec3(-.48, .78, .62));
  vec3 V = vec3(0., 0., 1.);
  float wrap = clamp((dot(n, L) + .32)/1.32, 0., 1.);
  float sh = mix(.38, 1., shadow(p + n*.012, L));
  float occ = ao(p, n);
  vec3 sky = mix(vec3(.42,.30,.22), vec3(.62,.70,.86), n.y*.5 + .5);       // warm bounce below, cool sky above
  vec3 col = alb * (sky*.42*occ + vec3(1.,.95,.86)*wrap*sh*1.25);
  vec3 H = normalize(L + V);
  col += specAmt * .6 * pow(max(dot(n, H), 0.), gloss) * sh * vec3(1.,.97,.9);
  float fres = pow(1. - max(dot(n, V), 0.), 3.);
  col += fres * (.10 + .16*max(n.y, 0.)) * mix(alb, vec3(1.,.95,.85), .5) * occ;   // rim light
  col = pow(col, vec3(.4545));
  // edge antialiasing from how grazing the surface is
  float a = smoothstep(0., .22, dot(n, V) + .04);
  gl_FragColor = vec4(col*a, a);
}
</script>

<script>
(function(){
  const stage = document.getElementById('stage');
  const hit = document.getElementById('hit');
  const canvas = document.getElementById('gl');
  const REST = 0.95;                       // resting turn: three-quarter view, facing right
  let reduced = false, alive = false, zoom = 1, timers = [], pose = 'needs';
  const post = (m) => { try { window.webkit.messageHandlers.hangabout.postMessage(m); } catch (e) { console.log('hangabout', m); } };
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));

  // ---------- WebGL ----------
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, antialias: false });
  let prog = null; const U = {};
  const fail = (msg) => post({type:'error', message: msg});
  if (!gl) fail('WebGL is not available');
  else {
    let ok = true;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { ok = false; fail('Shader error: ' + gl.getShaderInfoLog(s)); } return s; };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }'));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
    gl.linkProgram(p);
    if (ok && !gl.getProgramParameter(p, gl.LINK_STATUS)) { ok = false; fail('Link error: ' + gl.getProgramInfoLog(p)); }
    if (ok) {
      prog = p; gl.useProgram(p);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      ['uRes','uYaw','uSwing','uSignSwing','uSignYaw','uBlink','uKick','uTail','uSniff','uFail','uBreathe'].forEach(n => U[n] = gl.getUniformLocation(p, n));
    }
  }
  // Draw only as many pixels as the zoomed page shows, with a little extra for smooth edges.
  function resize(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const k = Math.min(dpr, Math.max(0.5, zoom * dpr * 1.5));
    canvas.width = Math.round(270 * k); canvas.height = Math.round(262 * k);
    if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    wake(0.1);
  }

  // ---------- motion ----------
  const S = { yaw: REST, yawV: 0, yawT: REST, swingAt: -1e9, swingAmp: 0, kickAt: -1e9, busyUntil: 0, last: 0, running: false, drag: null };
  const now = () => performance.now() / 1000;
  const damped = (t, amp, decay, period) => (t < 0 || t > 4) ? 0 : amp * Math.exp(-decay * t) * Math.sin(2 * Math.PI * t / period);
  function wake(sec){ S.busyUntil = Math.max(S.busyUntil, now() + sec); if (!S.running) { S.running = true; S.last = now(); requestAnimationFrame(frame); } }
  function swing(amp){ S.swingAt = now(); S.swingAmp = amp; wake(4.2); }

  function frame(){
    const t = now(), dt = Math.min(t - S.last, 0.05); S.last = t;
    // turn: a spring toward the target, with a little overshoot
    if (reduced) { S.yaw = S.yawT; S.yawV = 0; }
    else { const acc = 46 * (S.yawT - S.yaw) - 8.5 * S.yawV; S.yawV += acc * dt; S.yaw += S.yawV * dt; }
    const ts = t - S.swingAt;
    const life = alive && !reduced;
    const blinkPhase = (t % 5.2) / 0.2, sniffT = (t % 7) - 5.4;
    const u = {
      uYaw: S.yaw,
      uSwing: reduced ? 0 : damped(ts, S.swingAmp, 1.35, 1.05),
      uSignSwing: reduced ? 0 : damped(ts - 0.13, -S.swingAmp * 1.8, 1.1, 1.05),
      uSignYaw: reduced ? 0 : Math.max(-0.9, Math.min(0.9, -S.yawV * 0.16)),      // the sign lags behind a turn
      uBlink: life && blinkPhase < 1 ? Math.sin(Math.PI * blinkPhase) : 0,
      uKick: reduced ? 0 : damped(t - S.kickAt, 0.55, 2.2, 0.46),
      uTail: reduced ? 0 : damped(ts - 0.1, S.swingAmp * 1.8, 1.15, 1.05) + (life ? 0.07 * Math.sin(t * 1.05) : 0),
      uSniff: life && sniffT > 0 && sniffT < 1.2 ? Math.sin(sniffT * 15.7) * (1 - sniffT / 1.2) : 0,
      uFail: pose === 'failed' ? 1 : 0,
      uBreathe: life ? 0.012 * Math.sin(t * 1.5) : 0
    };
    if (prog) {
      gl.uniform2f(U.uRes, canvas.width, canvas.height);
      for (const k in u) gl.uniform1f(U[k], u[k]);
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    // Stop drawing once he is still, so a hanging Snuffler costs nothing. Idle life keeps it running.
    const visible = !stage.classList.contains('hidden');
    const moving = t < S.busyUntil || Math.abs(S.yawT - S.yaw) > 0.002 || Math.abs(S.yawV) > 0.01 || S.drag;
    if (visible && (moving || life)) requestAnimationFrame(frame); else S.running = false;
  }
  function turnTo(a, sec){ S.yawT = Math.max(-1.45, Math.min(1.45, a)); wake(sec || 1.5); }

  window.hangabout = {
    // pose: "needs" (question sign) or "failed" (sheepish, "!" sign)
    show(p, label){
      clear(); pose = p === 'failed' ? 'failed' : 'needs';
      stage.className = reduced ? 'reduced' : '';
      hit.setAttribute('aria-label', label || (pose === 'failed' ? 'Snuffler hit a problem. Show details' : 'Snuffler needs you. Show details'));
      if (reduced) { S.yaw = S.yawT = REST; wake(0.2); post({type:'shown'}); return; }
      S.yaw = -0.9; S.yawV = 0; S.yawT = REST;            // he spins in as he drops
      stage.classList.add('dropping'); wake(4.5);
      later(750, () => { stage.classList.remove('dropping'); swing(0.17); post({type:'shown'}); });
    },
    // level 1: one settling swing. level 2: bigger swing plus a leg kick.
    nudge(level){
      if (reduced || stage.classList.contains('hidden')) return;
      if (level >= 2) { S.kickAt = now(); swing(0.26); } else swing(0.17);
    },
    climb(){
      clear();
      if (reduced) { stage.className = 'hidden'; post({type:'climbed'}); return; }
      stage.classList.remove('dropping'); stage.classList.add('climbing'); turnTo(0, 1);
      later(650, () => { stage.className = 'hidden'; post({type:'climbed'}); });
    },
    hide(){ clear(); stage.className = 'hidden'; },
    setReducedMotion(on){ reduced = !!on; stage.classList.toggle('reduced', reduced); wake(0.3); },
    // blink, sniff, breathing, tail sway. Off by default: the spec says he hangs completely still.
    setIdle(on){ alive = !!on; wake(0.3); },
    // angle in radians: negative faces left, 0 faces you, positive faces right
    turn(angle){ turnTo(angle); },
    // the web view's page zoom, so the canvas isn't drawn larger than it's shown
    setZoom(z){ zoom = z > 0 ? z : 1; resize(); }
  };

  // drag to turn him; a plain click still counts as a click
  hit.addEventListener('pointerdown', e => { S.drag = { x: e.clientX, yaw: S.yawT, moved: false }; hit.setPointerCapture(e.pointerId); wake(1); });
  hit.addEventListener('pointermove', e => { if (!S.drag) return; const dx = e.clientX - S.drag.x; if (Math.abs(dx) > 4) S.drag.moved = true; if (S.drag.moved) turnTo(S.drag.yaw + dx / 70); });
  hit.addEventListener('pointerup', () => { const d = S.drag; S.drag = null; if (d && !d.moved) post({type:'clicked'}); });
  hit.addEventListener('pointercancel', () => { S.drag = null; });
  hit.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') post({type:'clicked'}); });

  resize();
  post({type:'ready'});
})();
</script>
</body>
</html>
